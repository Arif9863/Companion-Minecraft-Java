name: CompanionNPCs
version: 1.0.0
main: com.arif.companion.CompanionNpcsPlugin
api-version: '26.3'
authors: [Arif]
description: Skin-bearing Yui and Sandrone mannequin companions for Paper 26.3
commands:
  yui-npc:
    aliases: [yui-chan]
    description: Spawn or dismiss Yui mannequin NPC companion
    usage: /yui-npc [skin-url|default|off|item]
    permission: companion.npc.yui
  sandrone-npc:
    aliases: [sandrone-chan]
    description: Spawn or dismiss Sandrone mannequin NPC companion
    usage: /sandrone-npc [skin-url|default|off]
    permission: companion.npc.sandrone
  furina-npc:
    aliases: [furina-chan]
    description: Spawn or dismiss Furina mannequin NPC companion
    usage: /furina-npc [skin-url|default|off]
    permission: companion.npc.yui
  ei-npc:
    aliases: [ei-chan]
    description: Spawn or dismiss Ei mannequin NPC companion
    usage: /ei-npc [skin-url|default|off]
    permission: companion.npc.yui
  columbina-npc:
    aliases: [columbina-chan]
    description: Spawn or dismiss Columbina mannequin NPC companion
    usage: /columbina-npc [skin-url|default|off]
    permission: companion.npc.yui
  escoffier-npc:
    aliases: [escoffier-chan]
    description: Spawn or dismiss Escoffier mannequin NPC companion
    usage: /escoffier-npc [skin-url|default|off]
    permission: companion.npc.yui
  companionnpc:
    description: Companion NPC administration
    usage: /companionnpc <reload|clear>
    permission: companion.npc.admin
  kesini:
    description: Call your companions close to you for small rooms (stays until /ikut)
    usage: /kesini [yui|sandrone|semua]
    permission: companion.npc.close
  ikut:
    description: Bring your companions back to the normal formation and distance
    usage: /ikut [yui|sandrone|semua]
    permission: companion.npc.close
  tunggu:
    description: Tell your companions to wait where they are instead of following you
    usage: /tunggu [yui|sandrone|semua]
    permission: companion.npc.close
  istri:
    description: Call every companion that belongs to this owner at once
    usage: /istri [arif]
    permission: companion.npc.close
  yui:
    description: Call or dismiss Yui (the command the old Skript script used)
    usage: /yui
    permission: companion.npc.yui
  sandrone:
    description: Call or dismiss Sandrone (the command the old Skript script used)
    usage: /sandrone
    permission: companion.npc.sandrone
  yuiclear:
    description: Remove every Yui left behind
    usage: /yuiclear
    permission: companion.npc.yui
  sandroneclear:
    description: Remove every Sandrone left behind
    usage: /sandroneclear
    permission: companion.npc.sandrone
  yuisandrone:
    description: Mute or unmute the companions' chatter for the whole server
    usage: /yuisandrone
    permission: companion.npc.admin
  eris:
    aliases: [eris-chan]
    description: Call Eris, the standalone companion with one permanent owner
    usage: /eris [ikut|kesini|tunggu|off]
    permission: companion.npc.eris
permissions:
  companion.npc.yui:
    default: true
  companion.npc.sandrone:
    default: true
  companion.npc.admin:
    default: op
  companion.npc.close:
    default: true
  companion.npc.attack:
    default: true
  companion.npc.eris:
    default: true
